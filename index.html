<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WARZONE V4 - ROBLOX POV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0f1e;color:#fff;font-family:Arial;overflow:hidden}
#wrap{max-width:480px;margin:auto;height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;padding:8px 10px;background:#111827;font-weight:900;font-size:12px}
.topbar span{color:#facc15}
#gameBox{position:relative;flex:1;background:#4ade80;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
#joyBase{position:absolute;left:14px;bottom:14px;width:110px;height:110px;background:rgba(0,0,0,.35);border-radius:50%;border:2px solid rgba(255,255,255,.6);display:none}
#joyKnob{position:absolute;left:35px;top:35px;width:40px;height:40px;background:#fff;border-radius:50%}
#shootBtn{position:absolute;right:14px;bottom:20px;width:76px;height:76px;background:#dc2626;border:3px solid #fff;border-radius:50%;font-size:28px;display:none;align-items:center;justify-content:center}
#jumpBtn{position:absolute;right:100px;bottom:20px;width:56px;height:56px;background:#facc15;border:3px solid #fff;border-radius:50%;font-size:22px;display:none;align-items:center;justify-content:center;color:#000}
.panel{background:#111827;padding:6px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.btn{background:#2563eb;color:#fff;border:none;padding:9px 11px;border-radius:10px;font-weight:900;font-size:12px}
.btn.green{background:#16a34a}.btn.red{background:#dc2626}.btn.yellow{background:#facc15;color:#000}.btn.purple{background:#9333ea}
.shop{background:#1f2937;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:190px;overflow:auto}
.card{background:#374151;border-radius:10px;padding:7px;font-size:11px;line-height:1.4}
.card.mythic{border:2px solid #facc15}.card.legendary{border:2px solid #a855f7}.card.epic{border:2px solid #38bdf8}
#lobby{position:fixed;inset:0;background:linear-gradient(#0a0f1e,#1e3a8a);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
input{width:100%;max-width:320px;padding:11px;border-radius:12px;border:none;text-align:center;margin:5px 0}
#hud{position:fixed;top:52px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:8px 14px;border-radius:99px;font-weight:900;z-index:50;display:none;white-space:nowrap}
#winScreen{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#bossBar{height:12px;background:#1f2937;display:none;margin:4px 10px;border-radius:99px;overflow:hidden}
#bossBarInner{height:100%;background:linear-gradient(90deg,#ef4444,#facc15);width:100%}
</style>
</head>
<body>
<div id="hud"></div>
<div id="lobby">
<div style="font-size:70px">🧱🏝️⚔️</div>
<h1>WARZONE V4<br><span style="color:#facc15">POV ROBLOX</span></h1>
<p>By Fawzan • Kamera Ngikutin Lu!</p>
<input id="playerName" value="Fawzan" placeholder="Nama Kamu">
<button class="btn yellow" style="width:100%;max-width:320px;padding:13px;margin-top:8px" onclick="mulaiGame()">▶ PLAY! MASUK ROBLOX 🏝️</button>
<p style="font-size:11px;margin-top:8px;opacity:.7">Joystick kiri buat jalan • Tombol merah buat nembak<br>Redeem: FAWZANOP, WARZONE100</p>
</div>
<div id="winScreen"><div style="font-size:80px">🏆🎉👑</div><h1 style="color:#facc15">VICTORY!</h1><p id="winText">Kamu menang!</p><button class="btn yellow" style="padding:14px 20px;margin-top:10px" onclick="location.reload()">🔄 MAIN LAGI</button></div>
<div id="wrap">
<div class="topbar"><div>💰 <span id="gold">600</span> | ❤️ <span id="hp">20</span></div><div>🌊 <span id="wave">0</span>/30</div><div>☀️ Siang</div></div>
<div id="bossBar"><div id="bossBarInner"></div></div>
<div id="gameBox">
<canvas id="cv" width="480" height="360"></canvas>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="shootBtn">🔫</div>
<div id="jumpBtn">⬆️</div>
</div>
<div class="panel">
<button class="btn" onclick="startWave()">▶ START WAVE</button>
<button class="btn yellow" onclick="toggleMusic()">🎵 LAGU</button>
<button class="btn purple" onclick="rebirth()">♻️ REBIRTH</button>
<button class="btn red" onclick="location.reload()">🏠 LOBBY</button>
</div>
<div style="display:flex;gap:5px;padding:5px;background:#111827"><input id="redeemInput" placeholder="Kode Redeem... FAWZANOP" style="flex:1;margin:0"><button class="btn green" onclick="redeem()">REDEEM 🎁</button></div>
<div class="shop" id="shop"></div>
<div style="text-align:center;font-size:11px;padding:6px;background:#111827">Rebirth: <span id="rb">0</span>x • <span id="selInfo">Pilih senjata, terus TEMBAK!</span></div>
</div>
<audio id="warMusic" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-14.mp3"></audio>
<script>
let cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let gold=600,hp=20,wave=0,level=1,rbCount=0,selected='pistol',enemies=[],bullets=[],parts=[],started=false,usedCodes=[];
let WORLD={w:1200,h:900};
let player={x:600,y:450,vx:0,vy:0,dir:1,walk:0,hp:100,face:'🙂',name:'Fawzan'};
let cam={x:0,y:0};
let joy={active:false,dx:0,dy:0};
let keys={};
let WEAPONS={pistol:{name:'Pistol',price:50,dmg:14,rate:320,range:220,emoji:'🔫',color:'#94a3b8',cls:''},rifle:{name:'Rifle',price:120,dmg:22,rate:280,range:280,emoji:'🎯',color:'#22c55e',cls:''},shotgun:{name:'Shotgun',price:280,dmg:45,rate:700,range:170,emoji:'💥',color:'#f97316',cls:''},ice:{name:'Ice Gun',price:350,dmg:28,rate:500,range:240,emoji:'❄️',color:'#38bdf8',cls:'epic'},laser:{name:'Laser',price:750,dmg:95,rate:240,range:340,emoji:'⚡',color:'#a855f7',cls:'legendary'},sultan:{name:'SULTAN GOLD',price:1300,dmg:190,rate:220,range:380,emoji:'👑',color:'#facc15',cls:'mythic'}};
function showMsg(t){let e=document.getElementById('hud');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function renderShop(){let h='';for(let k in WEAPONS){let w=WEAPONS[k];h+=`<div class="card ${w.cls}"><b>${w.emoji} ${w.name}</b><br>💰 ${w.price} • DMG ${w.dmg}<br><button class="btn green" onclick="pilihSenjata('${k}')">PAKE</button></div>`}document.getElementById('shop').innerHTML=h}renderShop();
function pilihSenjata(k){selected=k;document.getElementById('selInfo').textContent='Senjata: '+WEAPONS[k].name;showMsg(WEAPONS[k].emoji+' '+WEAPONS[k].name+' dipake!')}
function mulaiGame(){player.name=document.getElementById('playerName').value||'Fawzan';document.getElementById('lobby').style.display='none';document.getElementById('joyBase').style.display='block';document.getElementById('shootBtn').style.display='flex';document.getElementById('jumpBtn').style.display='flex';started=true;showMsg('Selamat datang '+player.name+'! Jalan pake joystick!');loop()}
function toggleMusic(){let a=document.getElementById('warMusic');a.paused?a.play():a.pause()}
function rebirth(){if(level<5)return showMsg('Rebirth butuh LV 5!');rbCount++;level=1;wave=0;gold=600;showMsg('♻️ REBIRTH!');updateHUD()}
function redeem(){let code=document.getElementById('redeemInput').value.trim().toUpperCase();if(!code)return;if(usedCodes.includes(code))return showMsg('Udah dipake!');let R={FAWZANOP:2000,WARZONE100:1000};if(!R[code])return showMsg('Kode salah!');usedCodes.push(code);gold+=R[code];showMsg('🎁 +'+R[code]+' Gold!');updateHUD()}
function updateHUD(){document.getElementById('gold').textContent=Math.floor(gold);document.getElementById('hp').textContent=hp;document.getElementById('wave').textContent=wave;document.getElementById('rb').textContent=rbCount}
function startWave(){if(enemies.length>0)return showMsg('Wave masih jalan!');wave++;let isBoss=wave%5==0;if(isBoss){enemies.push({x:100,y:100,hp:800+wave*200,maxHp:800+wave*200,speed:0.9,type:'boss',walk:0});showMsg('💀 BOSS DATANG!');document.getElementById('bossBar').style.display='block'}else{let c=4+wave*2;for(let i=0;i<c;i++){enemies.push({x:Math.random()*WORLD.w,y:Math.random()<0.5?0:WORLD.h,hp:60+wave*30,maxHp:60+wave*30,speed:1+Math.random()*0.6,type:'normal',walk:Math.random()*10})}showMsg('🌊 Wave '+wave+'! '+c+' musuh!')}updateHUD()}
function shoot(){if(!started)return;let w=WEAPONS[selected];let target=null,best=9999;for(let en of enemies){let d=Math.hypot(en.x-player.x,en.y-player.y);if(d<w.range&&d<best){best=d;target=en}}if(!target)return;bullets.push({x:player.x,y:player.y,tx:target.x,ty:target.y,dmg:w.dmg,type:selected});player.dir=target.x<player.x?-1:1}
document.getElementById('shootBtn').addEventListener('touchstart',e=>{e.preventDefault();shoot()});
document.getElementById('shootBtn').addEventListener('click',shoot);
document.getElementById('jumpBtn').addEventListener('touchstart',e=>{e.preventDefault();player.vy=-9;});
let joyBase=document.getElementById('joyBase'),joyKnob=document.getElementById('joyKnob');
function joyMove(e){let t=e.touches?e.touches[0]:e;let r=joyBase.getBoundingClientRect();let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);let d=Math.hypot(dx,dy);if(d>35){dx=dx/d*35;dy=dy/d*35}joyKnob.style.left=(35+dx)+'px';joyKnob.style.top=(35+dy)+'px';joy.dx=dx/35;joy.dy=dy/35}
function joyEnd(){joy.dx=0;joy.dy=0;joyKnob.style.left='35px';joyKnob.style.top='35px'}
joyBase.addEventListener('touchmove',e=>{e.preventDefault();joyMove(e)},{passive:false});
joyBase.addEventListener('touchend',joyEnd);
joyBase.addEventListener('touchstart',e=>{e.preventDefault();joyMove(e)},{passive:false});
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function drawBlocky(x,y,face,color,scale,isBoss){ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,18*scale,16*scale,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.fillRect(-14*scale,-2*scale,28*scale,20*scale);ctx.fillStyle='#facc15';ctx.fillRect(-14*scale,14*scale,28*scale,4*scale);ctx.fillStyle='#fde68a';ctx.fillRect(-11*scale,-18*scale,22*scale,16*scale);ctx.fillStyle='#111';ctx.fillRect(-11*scale,-18*scale,22*scale,5*scale);ctx.font=(14*scale)+'px Arial';ctx.textAlign='center';ctx.fillText(face,0,-4*scale);ctx.restore()}
function drawWorld(){ctx.fillStyle='#38bdf8';ctx.fillRect(0,0,cv.width,cv.height);ctx.save();ctx.translate(-cam.x,-cam.y);ctx.fillStyle='#4ade80';ctx.beginPath();ctx.ellipse(WORLD.w/2,WORLD.h/2,WORLD.w/2,WORLD.h/2,0,0,Math.PI*2);ctx.fill();ctx.font='30px Arial';ctx.fillText('🌴',80,120);ctx.fillText('🌴',1050,120);ctx.fillText('🏰',560,820);ctx.fillText('🏠',1020,780);ctx.fillText('🌴',120,780);ctx.fillStyle='#78350f';ctx.fillRect(0,400,WORLD.w,44);ctx.fillStyle='#a16207';ctx.fillRect(0,400,WORLD.w,10);for(let en of enemies){drawBlocky(en.x,en.y,en.type=='boss'?'😈':'👹','#7f1d1d',en.type=='boss'?1.6:1);ctx.fillStyle='red';ctx.fillRect(en.x-20,en.y-38,40,6);ctx.fillStyle='lime';ctx.fillRect(en.x-20,en.y-38,40*(en.hp/en.maxHp),6)}drawBlocky(player.x,player.y,player.face,'#2563eb',1.2);ctx.font='bold 12px Arial';ctx.fillStyle='white';ctx.textAlign='center';ctx.fillText(player.name,player.x,player.y-32);for(let b of bullets){ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(b.x,b.y,6,0,Math.PI*2);ctx.fill()}for(let p of parts){ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,5,5)}ctx.restore()}
function loop(){if(!started)return;let mx=joy.dx+(keys['d']?1:0)-(keys['a']?1:0);let my=joy.dy+(keys['s']?1:0)-(keys['w']?1:0);player.x+=mx*4.2;player.y+=my*4.2;player.x=Math.max(20,Math.min(WORLD.w-20,player.x));player.y=Math.max(20,Math.min(WORLD.h-20,player.y));if(mx!=0)player.dir=mx>0?1:-1;if(mx!=0||my!=0)player.walk+=0.3;cam.x+= (player.x-cv.width/2 - cam.x)*0.12;cam.y+= (player.y-cv.height/2 - cam.y)*0.12;cam.x=Math.max(0,Math.min(WORLD.w-cv.width,cam.x));cam.y=Math.max(0,Math.min(WORLD.h-cv.height,cam.y));for(let i=enemies.length-1;i>=0;i--){let en=enemies[i];en.walk+=0.2;let dx=player.x-en.x,dy=player.y-en.y,d=Math.hypot(dx,dy)||1;en.x+=dx/d*en.speed;en.y+=dy/d*en.speed;if(d<32){hp-=1;enemies.splice(i,1);if(hp<=0){alert('💀 KALAH! Coba FAWZANOP!');location.reload();return}updateHUD()}}for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=(b.tx-b.x)*0.25;b.y+=(b.ty-b.y)*0.25;if(Math.hypot(b.x-b.tx,b.y-b.ty)<14){bullets.splice(i,1);for(let en of enemies){if(Math.hypot(en.x-b.tx,en.y-b.ty)<32){en.hp-=b.dmg;parts.push({x:en.x,y:en.y,c:'#facc15'});if(en.hp<=0){gold+=en.type=='boss'?600:20+wave*5;enemies.splice(enemies.indexOf(en),1);if(en.type=='boss')document.getElementById('bossBar').style.display='none';if(enemies.length==0){if(wave>=30){document.getElementById('winScreen').style.display='flex'}else{showMsg('🎉 Wave clear!');if(wave%3==0)level++;updateHUD()}}break}}}}for(let i=parts.length-1;i>=0;i--){parts[i].y-=1;if(parts[i].y<0)parts.splice(i,1)}if(enemies.length>0&&enemies[0].type=='boss')document.getElementById('bossBarInner').style.width=(enemies[0].hp/enemies[0].maxHp*100)+'%';drawWorld();requestAnimationFrame(loop)}
</script>
</body>
</html>
